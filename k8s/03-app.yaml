apiVersion: apps/v1
kind: Deployment
metadata:
  name: airline-rag-app
  namespace: rag-app
  labels:
    app: airline-rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airline-rag-app
  template:
    metadata:
      labels:
        app: airline-rag-app
    spec:
      containers:
        - name: app
          image: airline-rag-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rag-app-config
            - secretRef:
                name: rag-app-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: airline-rag-app-service
  namespace: rag-app
  labels:
    app: airline-rag-app
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
  selector:
    app: airline-rag-app

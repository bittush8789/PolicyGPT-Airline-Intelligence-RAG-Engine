apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-app-config
  namespace: rag-app
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  LLM_MODEL: "openai/gpt-oss-120b"
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  LOG_LEVEL: "INFO"
  VECTOR_DB_CONNECTION_STRING: "postgresql://postgres:postgrespassword@postgres-service:5432/vectordb"
  CONVERSATION_DB_CONNECTION_STRING: "postgresql://postgres:postgrespassword@postgres-service:5432/statedb"
  DOCUMENTS_DIR: "/app/documents"
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "policygpt-airline-rag"
  LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: rag-app-secrets
  namespace: rag-app
type: Opaque
stringData:
  # Replace with your actual Groq API key (console.groq.com)
  GROQ_API_KEY: "gsk_your_actual_groq_api_key_here"
  ADMIN_API_KEY: "admin-secret-key-123"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  # Optional LangSmith API key (smith.langchain.com)
  LANGCHAIN_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: rag-app
data:
  init-db.sql: |
    CREATE DATABASE vectordb;
    CREATE DATABASE statedb;

    \c vectordb;
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    \c statedb;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
